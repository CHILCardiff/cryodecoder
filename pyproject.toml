[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "cryodecoder"
version= "1.0.0"
authors = [
    {name = "Paul Biggs"},
    {name = "Lisa Craw", email = "crawl@cardiff.ac.uk"},
    {name = "Jono Hawkins", email = "hawkinsj22@cardiff.ac.uk"},
    {name = "Mike Prior-Jones", email="prior-jonesm@cardiff.ac.uk"}   
]
description = "Module for decoding CHIL data packets."
readme = "README.md"
requires-python = ">=3.14" 
dependencies = [
    "pyserial",
    "pytest", 
]

[project.scripts]
cryodecoder = "cryodecoder.parser:parser_main"
# seriallogger = "cryodecoder.serial:serial_decoder_cli_entry"
# cryoeggsddecoder = "cryodecoder.file:read_cryoegg_sd_file_cli"

[project.urls]
GitHub="https://github.com/CHILCardiff/cryodecoder"
Documentation="https://github.com/CHILCardiff/cryodecoder/wiki"